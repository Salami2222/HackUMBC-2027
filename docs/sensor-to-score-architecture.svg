<svg xmlns="http://www.w3.org/2000/svg" width="800" height="645" viewBox="0 0 800 645" role="img" aria-labelledby="title desc"><title id="title">Kinetiq | Sensor-to-score architecture</title><desc id="desc">Physical IMUs feed SlimeVR and calibration; measured scoring and confidence-gated Jev review combine into a final per-repetition score. Local scoring remains available without AI.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0 0 L9 4.5 L0 9Z" fill="#64748b"/></marker></defs><rect width="800" height="645" rx="18" fill="#f8fafc"/><g font-family="Arial, Helvetica, sans-serif"><text x="400" y="34" font-size="20" font-weight="700" text-anchor="middle" fill="#0f172a">KINETIQ  /  SENSOR-TO-SCORE ARCHITECTURE</text><rect x="240" y="54" width="320" height="79" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/><text x="400" y="80" font-size="17" font-weight="700" text-anchor="middle" fill="#0f172a">BMI270 IMUs + ESP32</text><text x="400" y="103" font-size="14" font-weight="400" text-anchor="middle" fill="#334155">Wireless physical motion tracking</text><path d="M400 133 V153" fill="none" stroke="#64748b" stroke-width="2"  marker-end="url(#arrow)"/><rect x="240" y="155" width="320" height="81" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/><text x="400" y="181" font-size="17" font-weight="700" text-anchor="middle" fill="#0f172a">SlimeVR + calibration</text><text x="400" y="204" font-size="14" font-weight="400" text-anchor="middle" fill="#334155">Relative quaternion joint-angle estimates</text><path d="M400 236 V255 H205 V278" fill="none" stroke="#64748b" stroke-width="2"  marker-end="url(#arrow)"/><path d="M400 236 V255 H595 V278" fill="none" stroke="#64748b" stroke-width="2"  marker-end="url(#arrow)"/><rect x="45" y="280" width="320" height="111" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.6"/><text x="205" y="306" font-size="17" font-weight="700" text-anchor="middle" fill="#0f172a">Measured movement analysis</text><text x="205" y="329" font-size="14" font-weight="400" text-anchor="middle" fill="#334155">Median filtering + phase state machine</text><text x="205" y="348" font-size="14" font-weight="400" text-anchor="middle" fill="#334155">Five weighted form criteria</text><text x="205" y="367" font-size="14" font-weight="400" text-anchor="middle" fill="#334155">95% when AI review qualifies</text><rect x="435" y="280" width="320" height="111" rx="10" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.6"/><text x="595" y="306" font-size="17" font-weight="700" text-anchor="middle" fill="#0f172a">Jev AI form review</text><text x="595" y="329" font-size="14" font-weight="400" text-anchor="middle" fill="#334155">28 summarized measurement metrics</text><text x="595" y="348" font-size="14" font-weight="400" text-anchor="middle" fill="#334155">Confidence and data-quality gates</text><text x="595" y="367" font-size="14" font-weight="400" text-anchor="middle" fill="#334155">5% eligible numeric score weight</text><path d="M205 391 V420 H400 V449" fill="none" stroke="#64748b" stroke-width="2"  marker-end="url(#arrow)"/><path d="M595 391 V420 H400 V449" fill="none" stroke="#64748b" stroke-width="2"  marker-end="url(#arrow)"/><rect x="220" y="451" width="360" height="96" rx="10" fill="#ecfdf5" stroke="#16a34a" stroke-width="1.6"/><text x="400" y="477" font-size="17" font-weight="700" text-anchor="middle" fill="#0f172a">Final per-repetition form score</text><text x="400" y="500" font-size="14" font-weight="400" text-anchor="middle" fill="#334155">0–100 experimental assessment</text><text x="400" y="519" font-size="14" font-weight="400" text-anchor="middle" fill="#334155">Measured-only fallback if AI is ineligible</text><text x="400" y="579" font-size="14" font-weight="400" text-anchor="middle" fill="#334155">Jev phase advice is bounded; local detection remains authoritative.</text><text x="400" y="601" font-size="13" font-weight="400" text-anchor="middle" fill="#334155">Configured weights and confidence gates are not validated accuracy metrics.</text></g></svg>